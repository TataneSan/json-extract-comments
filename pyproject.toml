[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "json-extract-comments"
version = "1.0.0"
description = "Extract comment-like fields (\"//\", \"comment_*\") from JSONL documents"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
json-extract-comments = "json_extract_comments.cli:main"
